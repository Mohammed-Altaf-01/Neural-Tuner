[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-neural_tuner_env"
version = "0.1.0"
description = "Neural Tuner Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "black>=26.3.1",
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    # install from github
    # "openenv-core[core] @ git+https://github.com/meta-pytorch/OpenEnv.git",
    "isort>=8.0.1",
    "openenv-core[core]>=0.2.2",
    # Environment-specific dependencies
    # Add all dependencies needed for your environment here
    # Examples:
    # "numpy>=1.19.0",
    # "torch>=2.0.0",
    # "gymnasium>=0.29.0",
    # "openspiel>=1.0.0",
    # "smolagents>=1.22.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
training = [
    "trl>=0.12.1",
    "transformers>=4.48.0",
    "datasets>=3.1.0",
    "accelerate>=1.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m neural_tuner_env.server.app
server = "neural_tuner_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["neural_tuner_env", "neural_tuner_env.server"]
package-dir = { "neural_tuner_env" = ".", "neural_tuner_env.server" = "server" }
